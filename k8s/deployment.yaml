apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubernetes-web-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kubernetes-web-app

  template:
    metadata:
      labels:
        app: kubernetes-web-app

    spec:
      containers:
        - name: kubernetes-web-app
          image: kubernetes-web-app:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 80